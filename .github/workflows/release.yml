name: Release Multiplatform (Linux, Windows, macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.0)'
        required: false
        default: ''
      draft:
        description: 'Create as Draft Release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-matrix:
    name: Build on ${{ matrix.os }} (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact_name: lack-linux
            build_cmd: npm run build:linux
          - os: macos-latest
            platform: mac
            artifact_name: lack-mac
            build_cmd: npm run build:mac
          - os: windows-latest
            platform: windows
            artifact_name: lack-windows
            build_cmd: npm run build:win

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application Bundles
        run: npm run build:bundle

      - name: Package with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.build_cmd }}

      - name: Stage Artifacts (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p release-staging
          cp dist/*.AppImage release-staging/ 2>/dev/null || true
          cp dist/*.deb release-staging/ 2>/dev/null || true
          cp dist/*.tar.gz release-staging/ 2>/dev/null || true

      - name: Stage Artifacts (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          mkdir -p release-staging
          cp dist/*.dmg release-staging/ 2>/dev/null || true
          cp dist/*.zip release-staging/ 2>/dev/null || true

      - name: Stage Artifacts (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p release-staging
          cp dist/*.exe release-staging/ 2>/dev/null || true
          cp dist/*.zip release-staging/ 2>/dev/null || true

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-staging/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish Multiplatform GitHub Release
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare Final Release Assets
        id: prepare
        shell: bash
        run: |
          mkdir -p release-assets
          find all-artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          echo "=== Collected Release Assets ==="
          ls -la
          
          # Generate SHA256 checksums
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

          # Determine Tag Name
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag_name }}
          name: "Lack ${{ steps.prepare.outputs.tag_name }}"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
